<title>Paywall v2 Prototype</title>
<style>
/* Layout: the Kickresume builder fills the light page (desktop = full view; tablet/mobile = framed device, scaled to fit).
   A compact navy toolbar floats on the right; settings, triggers and the event log open as popovers beside it.
   App styling follows the Kickresume Design System (colors_and_type.css): coral for primary CTAs + errors only,
   premium gradient for upgrade surfaces, Henk-Work display / Graphik Web UI, six-tone grey scale, Lucide icons.
   Kickresume is light-only, so the page commits to one look and sets every color explicitly. */
:root {
  color-scheme: light;
  /* ---- Kickresume Design System tokens (verbatim) ---- */
  --kr-primary: #ff5e59; --kr-primary-hover: #ff736e; --kr-primary-active: #cd2927; --kr-primary-light: #f8aca7; --kr-primary-tint: #fff4f3;
  --kr-blue: #514eea; --kr-blue-darker: #3249bf; --kr-blue-light: #9795f2; --kr-blue-very-light: #f3f2fd; --kr-blue-dark: #081430; --kr-nautilius: #29405c;
  --kr-btn-dark-hover: #29405c; --kr-btn-dark-press: #3a4c63;
  --kr-btn-white-hover: #f2f2f2; --kr-btn-grad-hover: linear-gradient(315deg, #b07dff 0%, #7a80ff 100%); --kr-btn-grad-press: linear-gradient(315deg, #8f4fee 0%, #5359e6 100%);
  --kr-btn-grad-solid: #5b53e6; --kr-btn-grad-tint: #f3f2fd;
  --kr-premium-gradient: linear-gradient(315deg, #a066ff 0%, #666cff 100%);
  --kr-grey-100: #3f3f3f; --kr-grey-80: #8c8c8c; --kr-grey-60: #e9e9e9; --kr-grey-40: #f2f2f2; --kr-grey-20: #fafafa; --kr-white: #fff; --kr-background: #f4f7f8;
  --kr-green: #056640; --kr-green-mint: #1da36e; --kr-light-mint: #edf8f4; --kr-yellow: #ffc107;
  --kr-font-sans: "Graphik Web", Roboto, "Helvetica Neue", Arial, sans-serif;
  --kr-font-display: "Henk-Work", "Graphik Web", Georgia, serif;
  --kr-radius: 6px; --kr-radius-md: 16px; --kr-radius-lg: 24px; --kr-radius-btn: 10px; --kr-radius-pill: 999px;
  --kr-shadow-dropdown: 1px 2px 10px 0 rgba(0,0,0,.1);
  --kr-shadow-modal: 1px 2px 20px 0 rgba(0,0,0,.1);
  --kr-shadow-search-cv: 0 8px 20px 0 rgba(140,140,140,.18);
  --kr-shadow-premium-light: 1px 2px 6px 0 rgba(160,102,255,.3), 1px 2px 16px 0 rgba(102,108,255,.3);
  --kr-shadow-premium-heavy: 1px 2px 6px 0 rgba(160,102,255,.3), 1px 2px 16px 0 rgba(102,108,255,1);
  --kr-focus-ring: 0 0 0 3px rgba(63,63,63,.35);
  /* ---- prototype toolbar (Dark Blue) ---- */
  --tb-bg: var(--kr-blue-dark); --tb-fg: #c9cfe0; --tb-line: rgba(255,255,255,.12);
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--kr-background); color: var(--kr-grey-100); font-family: var(--kr-font-sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--kr-focus-ring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.lucide { width: 20px; height: 20px; flex: none; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- stage ---------- */
.stage { position: fixed; top: 0; bottom: 0; left: 0; right: 76px; display: grid; place-items: center; overflow: hidden; background: var(--kr-background); }
.scaler { position: relative; }
.device { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: var(--kr-white); color: var(--kr-grey-100); overflow: hidden; container-type: inline-size; container-name: app; font-family: var(--kr-font-sans); color-scheme: light; letter-spacing: .06px; }
.device.framed { border-radius: 20px; border: 1px solid var(--kr-grey-60); box-shadow: var(--kr-shadow-modal); }
.device.full { border-right: 1px solid var(--kr-grey-60); }

/* ---------- floating toolbar ---------- */
.tb { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 100; background: var(--tb-bg); border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 30px rgba(8,20,48,.28); }
.tb-grp { display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.06); border-radius: 12px; padding: 4px; }
.tb-sep { height: 1px; background: var(--tb-line); margin: 0 8px; }
.tb button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: var(--tb-fg); display: grid; place-items: center; cursor: pointer; font-weight: 500; font-size: 15px; position: relative; transition: background .2s, color .2s; }
.tb button:hover { background: rgba(255,255,255,.1); color: #fff; }
.tb button[aria-pressed="true"] { background: var(--kr-blue); color: #fff; }
.tb button.auto { box-shadow: inset 0 0 0 1.5px var(--kr-blue-light); color: #fff; }
.tb button:focus-visible { box-shadow: 0 0 0 2px var(--kr-blue-light); }
.tb .lucide { width: 18px; height: 18px; }
.tb .count { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--kr-yellow); color: var(--kr-blue-dark); font-size: 10px; font-weight: 500; display: grid; place-items: center; line-height: 1; }
.tb button[data-tip]:hover::after { content: attr(data-tip); position: absolute; right: calc(100% + 12px); top: 50%; transform: translateY(-50%); background: var(--tb-bg); color: #fff; font-size: 12px; font-weight: 400; padding: 6px 9px; border-radius: 6px; white-space: nowrap; pointer-events: none; box-shadow: var(--kr-shadow-dropdown); }
.tb button[aria-expanded="true"]::after { display: none; }

/* ---------- popovers ---------- */
.pop { position: fixed; right: 80px; top: 50%; transform: translateY(-50%); z-index: 99; width: 300px; max-height: calc(100% - 32px); overflow: auto; background: #fff; border: 1px solid var(--kr-grey-60); border-radius: 12px; box-shadow: var(--kr-shadow-modal); color: var(--kr-grey-100); padding: 14px 16px 16px; display: grid; gap: 14px; animation: popIn .15s ease; }
@keyframes popIn { from { opacity: 0; transform: translate(6px, -50%); } to { opacity: 1; transform: translate(0, -50%); } }
.pop h3 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--kr-grey-80); font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pop .grp { display: grid; gap: 8px; }
.pop .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.pop .sep { height: 1px; background: var(--kr-grey-60); }
.seg { display: inline-flex; border: 1px solid var(--kr-grey-60); border-radius: 8px; overflow: hidden; flex: none; }
.seg button { background: #fff; border: 0; padding: 5px 10px; cursor: pointer; color: var(--kr-grey-100); font-size: 12.5px; font-weight: 500; }
.seg button:hover { background: var(--kr-grey-40); }
.seg button[aria-pressed="true"] { background: var(--kr-blue); color: #fff; }
.seg button + button { border-left: 1px solid var(--kr-grey-60); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.chk input { accent-color: var(--kr-blue); margin: 0; }
.mini-input, .mini-select { border: 1px solid var(--kr-grey-60); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; background: #fff; color: var(--kr-grey-100); min-width: 0; }
.mini-input { width: 110px; font-family: var(--f-mono); }
.mini-input:focus, .mini-select:focus { outline: none; border-color: var(--kr-blue); }
.mini-btn { background: #fff; border: 1px solid var(--kr-grey-60); color: var(--kr-grey-100); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; font-weight: 500; text-align: left; }
.mini-btn:hover { background: var(--kr-grey-40); }
.trig-list { display: grid; gap: 6px; }
.trig-list .mini-btn { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.trig-list .mini-btn .lucide { width: 16px; height: 16px; color: var(--kr-grey-80); }
.trig-list .mini-btn small { margin-left: auto; color: var(--kr-grey-80); font-family: var(--f-mono); font-size: 11px; }
.assign { font-family: var(--f-mono); font-size: 12px; line-height: 1.8; }
.assign b { font-weight: 500; }
.pill { display: inline-block; padding: 0 8px; border-radius: var(--kr-radius-pill); font-size: 11px; font-family: var(--f-mono); line-height: 18px; }
.pill.variant { background: var(--kr-blue-very-light); color: var(--kr-blue); }
.pill.control { background: var(--kr-grey-40); color: var(--kr-grey-100); }
.pill.off { background: #fbefda; color: var(--kr-grey-100); }
.pop.log { width: 360px; height: min(600px, calc(100% - 32px)); grid-template-rows: auto 1fr; gap: 10px; padding-bottom: 10px; }
.events { overflow: auto; display: flex; flex-direction: column; gap: 8px; margin: 0 -6px; padding: 0 6px; }
.ev { border: 1px solid var(--kr-grey-60); background: var(--kr-grey-20); border-radius: var(--kr-radius); padding: 8px 10px; font-family: var(--f-mono); font-size: 11.5px; animation: evIn .5s ease; }
.ev-h { display: flex; justify-content: space-between; gap: 8px; }
.ev-name { font-weight: 500; }
.ev-name.new { color: var(--kr-blue); }
.ev-t { color: var(--kr-grey-80); }
.ev pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--kr-grey-100); opacity: .8; font-family: inherit; }
.ev-empty { color: var(--kr-grey-100); font-size: 13px; line-height: 1.55; }
@keyframes evIn { from { background: var(--kr-blue-very-light); } to { background: var(--kr-grey-20); } }

@media (max-width: 700px) {
  .stage { right: 0; bottom: 68px; }
  .device.full { border-right: 0; border-bottom: 1px solid var(--kr-grey-60); }
  .tb { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: 50%; transform: translateX(50%); flex-direction: row; padding: 4px; gap: 4px; }
  .tb-grp { flex-direction: row; padding: 2px; gap: 2px; }
  .tb-sep { width: 1px; height: auto; margin: 6px 0; }
  .tb button { width: 36px; height: 36px; }
  .tb button[data-tip]:hover::after { display: none; }
  .pop, .pop.log { left: 12px; right: 12px; width: auto; top: auto; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); transform: none; max-height: 70%; animation: none; }
  .pop.log { height: 60%; }
}

/* ---------- app: builder (Builder UI kit) ---------- */
.app { position: absolute; inset: 0; display: grid; grid-template-rows: 72px 1fr; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 0 24px; background: var(--kr-white); border-bottom: 1px solid var(--kr-grey-60); position: relative; }
.logo { display: block; height: 22px; width: auto; }
.logo-sym { display: none; height: 28px; width: auto; }
.tabs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 4px; background: var(--kr-white); border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius-md); padding: 6px; box-shadow: var(--kr-shadow-dropdown); }
.tab { padding: 9px 18px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--kr-grey-80); }
.tab.on { color: var(--kr-blue); box-shadow: var(--kr-shadow-dropdown); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.sticker { font-style: italic; font-weight: 700; text-transform: uppercase; color: var(--kr-btn-grad-solid); font-size: 15px; letter-spacing: -.2px; }
.top-dl { display: inline-flex; align-items: center; gap: 8px; color: var(--kr-blue); font-weight: 500; font-size: 15px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--kr-grey-40); display: grid; place-items: center; font-size: 12px; font-weight: 500; color: var(--kr-grey-100); }
.editor { display: grid; grid-template-columns: 1fr 380px; min-height: 0; overflow: auto; }
.preview-col { display: grid; place-items: start center; padding: 28px; min-width: 0; background: var(--kr-background); }
.panel-col { background: var(--kr-white); border-left: 1px solid var(--kr-grey-60); padding: 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.label { margin: 6px 0 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--kr-grey-80); font-weight: 500; }
@container app (max-width: 900px) {
  .editor { grid-template-columns: 1fr; }
  .panel-col { border-left: 0; border-top: 1px solid var(--kr-grey-60); overflow: visible; }
  .preview-col { padding: 18px 16px 10px; }
  .tabs { display: none; }
}
@container app (max-width: 520px) {
  .topbar { padding: 0 16px; }
  .logo { display: none; } .logo-sym { display: block; }
  .top-dl span { display: none; }
}

/* resume mock: the user's own document (Martinus template, Source Serif Pro), scaled per use */
.rbox { position: relative; overflow: hidden; background: #fff; box-shadow: var(--kr-shadow-search-cv); border-radius: var(--kr-radius); flex: none; }
.resume { position: absolute; top: 0; left: 0; width: 595px; height: 842px; transform-origin: 0 0; padding: 44px 46px; font-family: "Source Serif 4", "Source Serif Pro", Georgia, serif; color: #22242f; font-size: 10.5px; line-height: 1.5; display: grid; grid-template-columns: 1fr 170px; gap: 0 30px; align-content: start; letter-spacing: 0; }
.resume header { grid-column: 1 / -1; border-bottom: 2px solid #2d3a8c; padding-bottom: 14px; margin-bottom: 18px; }
.resume h1 { font-weight: 700; font-size: 30px; margin: 0; letter-spacing: -.01em; color: #1b2160; }
.resume header p { margin: 3px 0 0; font-size: 12px; color: #4f5470; }
.resume h2 { font-weight: 700; font-size: 13px; color: #2d3a8c; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.resume .blk { margin-bottom: 16px; }
.resume .job b { display: block; font-size: 11px; }
.resume .job span { color: #6a6f88; font-size: 9.5px; }
.resume .job p { margin: 3px 0 9px; }
.resume .bar-g { height: 5px; background: #e4e6f2; border-radius: 3px; margin: 3px 0 7px; }
.resume .bar-g i { display: block; height: 100%; background: #2d3a8c; border-radius: 3px; }
.resume .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.resume .chips span { background: #eef0f8; padding: 2px 6px; border-radius: 3px; font-size: 9.5px; }

/* ---------- buttons (DS: 10px radius, weight 500, identical size in every state) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 24px; border-radius: var(--kr-radius-btn); border: 1px solid transparent; font: 500 16px/24px var(--kr-font-sans); cursor: pointer; transition: background .25s, box-shadow .3s, border-color .25s, color .25s; text-decoration: none; letter-spacing: .06px; }
.btn-coral { background: var(--kr-primary); color: #fff; }
.btn-coral:hover { background: var(--kr-primary-hover); }
.btn-coral:active { background: var(--kr-primary-active); }
.btn-coral[disabled] { background: var(--kr-primary-light); cursor: progress; }
.btn-white { background: #fff; color: var(--kr-grey-100); border-color: var(--kr-grey-60); }
.btn-white:hover { background: var(--kr-btn-white-hover); }
.btn-white:active { background: var(--kr-grey-60); }
.btn-gradient { background: var(--kr-premium-gradient); color: #fff; box-shadow: var(--kr-shadow-premium-light); }
.btn-gradient:hover { background: var(--kr-btn-grad-hover); box-shadow: var(--kr-shadow-premium-heavy); }
.btn-gradient:active { background: var(--kr-btn-grad-press); }
.btn-outline { background: transparent; color: var(--kr-grey-100); border-color: var(--kr-grey-60); }
.btn-outline:hover { background: var(--kr-grey-40); }
.btn-sm { min-height: 36px; padding: 6px 16px; font-size: 14px; line-height: 20px; }
.btn-block { width: 100%; }
.link { color: var(--kr-blue); font-weight: 500; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--kr-blue-darker); text-decoration: underline; }

/* ---------- download panel ---------- */
.card { border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius); padding: 14px 16px; background: var(--kr-white); }
.prem-card { color: #fff; background: var(--kr-premium-gradient); border-radius: var(--kr-radius-md); padding: 20px; display: grid; gap: 12px; }
.prem-card h4 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.3px; line-height: 1.2; }
.prem-card p { margin: 0; font-size: 14px; line-height: 20px; letter-spacing: .16px; }
.locked { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.locked li { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 20px; }
.locked .lucide { width: 16px; height: 16px; margin-top: 2px; }
.locked button.lk { background: none; border: 0; padding: 0; color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.55); text-underline-offset: 3px; cursor: pointer; text-align: left; font-size: 14px; }
.locked button.lk:hover { text-decoration-color: #fff; }
.locked details summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
.locked details summary::-webkit-details-marker { display: none; }
.locked details summary .lucide { width: 16px; height: 16px; margin: 0; transition: transform .2s; }
.locked details[open] summary .lucide { transform: rotate(180deg); }
.locked details small { display: block; margin-top: 4px; font-size: 13px; }
.reassure { font-size: 12px; text-align: center; letter-spacing: .16px; margin-top: -4px; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius); background: var(--kr-white); font-weight: 500; font-size: 14px; cursor: pointer; width: 100%; text-align: left; color: var(--kr-grey-100); transition: box-shadow .25s; }
.opt:hover { box-shadow: var(--kr-shadow-dropdown); }
.opt .lucide { color: var(--kr-grey-100); }
.mini { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--kr-grey-100); line-height: 20px; }
.mini b { display: block; font-weight: 500; }
.share-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.share-row code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--kr-grey-20); border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius); padding: 8px 10px; font-size: 12px; font-family: var(--f-mono); color: var(--kr-grey-100); }
.success-card { background: var(--kr-light-mint); border-radius: var(--kr-radius-md); padding: 20px; display: grid; gap: 10px; color: var(--kr-grey-100); }
.success-card h4 { margin: 0; font-size: 18px; font-weight: 500; line-height: 24px; display: flex; gap: 10px; align-items: flex-start; }
.success-card h4 .lucide { color: var(--kr-green-mint); width: 24px; height: 24px; }
.progress { height: 6px; background: #d3eee3; border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--kr-green-mint); transition: width 1.6s ease; }
.success-card p { margin: 0; font-size: 14px; line-height: 20px; }
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--kr-blue-dark); color: #fff; padding: 11px 18px; border-radius: var(--kr-radius-btn); font-size: 14px; z-index: 60; box-shadow: var(--kr-shadow-modal); max-width: calc(100% - 32px); }

/* ---------- modals (shared) ---------- */
.overlay { position: absolute; inset: 0; z-index: 40; background: rgba(8,20,48,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; overflow: auto; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.x { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: var(--kr-radius-btn); border: 0; background: transparent; cursor: pointer; color: var(--kr-grey-80); display: grid; place-items: center; z-index: 3; transition: background .25s, color .25s; }
.x:hover { background: var(--kr-grey-40); color: var(--kr-grey-100); }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 500; color: var(--kr-grey-100); }
.field input { min-height: 48px; border: 1px solid var(--kr-grey-60); border-radius: var(--kr-radius-btn); padding: 12px 16px; font: 400 16px var(--kr-font-sans); background: #fff; color: var(--kr-grey-100); font-variant-numeric: tabular-nums; width: 100%; min-width: 0; outline: none; transition: border-color .15s; }
.field input::placeholder { color: var(--kr-grey-80); }
.field input:hover { border-color: var(--kr-grey-80); }
.field input:focus { border-color: var(--kr-blue); box-shadow: none; }
.field input[aria-invalid="true"] { border-color: var(--kr-primary); }
.field .err { font-size: 12px; color: var(--kr-primary-active); letter-spacing: .16px; }
.card-grid { display: grid; grid-template-columns: 1fr 104px 84px; gap: 10px; }
@container app (max-width: 420px) { .card-grid { grid-template-columns: 1fr 1fr; } .card-grid .f-num { grid-column: 1 / -1; } }
.badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: var(--kr-radius-pill); background: var(--kr-blue); color: #fff; letter-spacing: .5px; text-transform: uppercase; line-height: 1.2; }
.badge.save { background: var(--kr-green); }

/* control: upgrade modal (today) */
.cm { position: relative; width: min(520px, 100%); background: #fff; border-radius: var(--kr-radius-md); overflow: hidden; box-shadow: var(--kr-shadow-modal); flex: none; }
.cm-top { background: var(--kr-premium-gradient); color: #fff; padding: 28px 28px 22px; }
.cm-top h2 { margin: 0 0 14px; font-family: var(--kr-font-display); font-weight: 400; font-size: 32px; line-height: 1.15; letter-spacing: -1px; }
.cm-top ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; font-size: 15px; }
.cm-top li { display: flex; gap: 8px; align-items: center; }

      track("Download click", { has_premium_items: true, variant: curArm() });
      openPaywall("download");
    } else if (act === "dl-premium") {

      track("CV download", { source: "post_purchase_retry", document_id: CONFIG.doc.id });
      toast(`Downloading ${CONFIG.doc.file}`);
    } else if (act === "free") toast(b.dataset.n === "Link copied" ? "Link copied" : `${b.dataset.n} (free path, unchanged)`);

}

function toast(msg) {

}

    if (e.target.closest("[data-pay]")) return cardPay();
  };
  r.onchange = e => {
    if (e.target.name === "vplan" || e.target.name === "cplan") {
      S.plan = e.target.value;
      track("Paywall plan select", { plan: S.plan, variant: a });
      updatePayBits();
    }
  };
  r.onfocusin = e => {
    if (e.target.matches(".field input") && !S.cardFocused) { S.cardFocused = true; track("Paywall payment method select", { method: "card", variant: a }); }
  };
  r.oninput = e => {
    const el = e.target;
    if (el.id === "ccNum") el.value = el.value.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
    if (el.id === "ccExp") { let v = el.value.replace(/\D/g, "").slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2); el.value = v; }
    if (el.id === "ccCvc") el.value = el.value.replace(/\D/g, "").slice(0, 4);
    if (el.matches(".field input")) setFieldErr(el, null);
  };
  const form = r.querySelector("#cardForm"); if (form) form.onsubmit = e => { e.preventDefault(); cardPay(); };
}

function setFieldErr(el, msg) {
  el.setAttribute("aria-invalid", msg ? "true" : "false");
  const sp = el.parentElement.querySelector(".err"); sp.hidden = !msg; sp.textContent = msg || "";
}
function cardPay() {
  const num = document.getElementById("ccNum"), exp = document.getElementById("ccExp"), cvc = document.getElementById("ccCvc");
  let ok = true;
  if (num.value.replace(/\s/g, "").length < 15) { setFieldErr(num, "Enter the full card number."); ok = false; }
  if (!/^(0[1-9]|1[0-2])\/\d\d$/.test(exp.value)) { setFieldErr(exp, "Use MM/YY."); ok = false; }
  if (cvc.value.length < 3) { setFieldErr(cvc, "3–4 digits."); ok = false; }
  if (S.modal === "pw") track("Paywall pay click", { plan: S.plan, method: "card", trigger: S.trigger, variant: curArm() });
  if (!ok) { (document.querySelector('[aria-invalid="true"]') || num).focus(); return; }
  process("card");
}
function expressSheet(method) {
  const names = { apple_pay: "Apple Pay", google_pay: "Google Pay", paypal: "PayPal" };
  const p = planById(S.plan);
  const root = document.getElementById("sheetRoot");
  root.innerHTML = `<div class="sheet-ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${names[method]}">
    <h4>${names[method]} <small>· simulated</small></h4>
    <div class="row"><span>Kickresume Premium · ${p.label}</span><b style="font-weight:500">${eur(p.charge)}.00</b></div>
    <div class="row"><span>Renews</span><span>every ${p.every}</span></div>
    <button class="btn btn-coral btn-block" data-ok>${method === "paypal" ? "Agree & continue" : "Confirm with " + names[method]}</button>
    <button class="btn btn-outline btn-block" data-cancel>Cancel</button></div></div>`;
  root.querySelector("[data-ok]").focus();
  root.onclick = e => {
    if (e.target.closest("[data-cancel]")) { root.innerHTML = ""; document.querySelector(`[data-x="${method}"]`)?.focus(); }
    if (e.target.closest("[data-ok]")) { root.innerHTML = ""; process(method); }
  };
}
function process(method) {
  const btn = document.querySelector("[data-pay]");
  if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Processing…`; }
  const gen = S.gen;
  setTimeout(() => {
    if (gen !== S.gen) return;
    const a = curArm();
    if (S.outcome === "decline") {
      S.error = method === "card" ? "Your card was declined. Try another card or PayPal."
        : method === "paypal" ? "PayPal couldn’t complete the payment. Try a card or another method."
        : "The payment didn’t go through. Try a card or PayPal.";
      track("Paywall payment error", { reason: method === "card" ? "card_declined" : "processor_declined", method, variant: a });
      if (btn) { btn.disabled = false; btn.textContent = S.modal === "pw" ? payLabel() : "Subscribe"; }
      const slot = document.getElementById("errSlot"); if (slot) slot.innerHTML = errHTML();
      document.querySelector(".pay-err")?.scrollIntoView({ block: "nearest" });
      return;
    }
    const p = planById(S.plan);
    track("Subscription creation", { plan: p.id, variant: a, trigger: S.trigger });
    track("Subscription payment", { plan: p.id, amount: p.charge, currency: "EUR", method, variant: a, trigger: S.trigger });
    S.premium = true; S.modal = null; S.error = null;
    const tr = S.trigger;
    if (a === "variant" && tr === "download") {
      S.downloadState = "running";
      renderApp();
      requestAnimationFrame(() => requestAnimationFrame(() => { const pr = document.getElementById("dlProg"); if (pr) pr.style.width = "100%"; }));
      track("CV download", { source: "post_purchase_auto", document_id: CONFIG.doc.id });
      const gen = S.gen; setTimeout(() => { if (gen !== S.gen) return; S.downloadState = "done"; const pnl = document.getElementById("panel"); if (pnl) { pnl.innerHTML = renderPanel(); const pr = document.getElementById("dlProg"); if (pr) pr.style.width = "100%"; } }, 1900);
    } else {
      renderApp();
      if (tr === "download") toast("Payment complete. Control: download does not start automatically (confirm in discovery §1.5).");
      else toast(`${FEATURES[tr]?.name || "Premium"} unlocked. Returning you to it.`);
    }
    renderAssign();
  }, 1100);
}

/* ===== Focus trap + Esc ===== */
document.addEventListener("keydown", e => {
  const sheet = document.querySelector("#sheetRoot .sheet");
  const dlg = sheet || document.querySelector("#modalRoot [role=dialog]");
  if (!dlg) return;
  if (e.key === "Escape") {
    e.preventDefault();
    if (sheet) { document.getElementById("sheetRoot").innerHTML = ""; return; }
    closeModal(); return;
  }
  if (e.key === "Tab") {
    const f = [...dlg.querySelectorAll("button:not([disabled]), input, a[href], summary, select")].filter(n => n.offsetParent !== null && !(n.type === "radio" && !n.checked));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!dlg.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }
});

/* ===== Prototype chrome: floating toolbar + popovers ===== */
const TRIGGERS = [["download", "Download panel", "download"], ["ai_writer", "AI writer", "sparkles"], ["tailoring", "Tailoring", "target"], ["ats_checker", "ATS checker", "scanText"], ["career_map", "Career map", "map"], ["dashboard", "Dashboard", "crown"], ["promo", "Promo", "crown"]];
function renderToolbar() {
  const a = arm(), auto = S.armMode === "auto" && !S.kill;
  const armBtn = (v, l, tip) => `<button data-arm="${v}" aria-label="${tip}" data-tip="${tip}" aria-pressed="${!auto && a === v}" class="${auto && a === v ? "auto" : ""}">${l}</button>`;
  const devBtn = (v, icon, tip) => `<button data-dev="${v}" aria-label="${tip}" data-tip="${tip}" aria-pressed="${S.device === v}">${ic(icon)}</button>`;
  const popBtn = (v, icon, tip, extra = "") => `<button data-pop="${v}" aria-label="${tip}" data-tip="${tip}" aria-expanded="${S.pop === v}" aria-pressed="${S.pop === v}">${ic(icon)}${extra}</button>`;
  document.getElementById("tb").innerHTML = `
    <div class="tb-grp">${armBtn("control", "A", "A · Control")}${armBtn("variant", "B", "B · Variant")}</div>
    <div class="tb-sep"></div>
    <div class="tb-grp">${devBtn("desktop", "monitor", "Desktop · full view")}${devBtn("tablet", "tablet", "Tablet · 768")}${devBtn("mobile", "smartphone", "Mobile · 375")}</div>
    <div class="tb-sep"></div>
    <div class="tb-grp">${popBtn("triggers", "zap", "Open paywall from…")}${popBtn("settings", "sliders", "Settings")}${popBtn("log", "activity", "Mixpanel events", S.unread ? `<span class="count">${S.unread > 99 ? "99+" : S.unread}</span>` : "")}</div>
    <div class="tb-sep"></div>
    <button data-act="reset" aria-label="Reset user" data-tip="Reset user">${ic("rotate")}</button>`;
}
function renderPop() {
  const r = document.getElementById("popRoot");
  if (!S.pop) { r.innerHTML = ""; return; }
  if (S.pop === "triggers") {
    r.innerHTML = `<div class="pop" role="dialog" aria-label="Open paywall from">
      <h3>Open paywall from</h3>
      <div class="trig-list">${TRIGGERS.map(([v, l, icon]) => `<button class="mini-btn" data-t="${v}">${ic(icon)}${l}<small>${v}</small></button>`).join("")}</div>
    </div>`;
  } else if (S.pop === "settings") {
    r.innerHTML = `<div class="pop" role="dialog" aria-label="Settings">
      <div class="grp"><h3>Assignment</h3><div class="assign" id="assign"></div>
        <label class="row"><span>Assign by user-ID hash</span><input type="checkbox" id="autoArm" ${S.armMode === "auto" ? "checked" : ""} style="accent-color:var(--kr-blue)"></label>
        <label class="row"><span>User ID</span><input id="uid" class="mini-input" value="${esc(S.uid)}" autocomplete="off"></label>
        <label class="row"><span>Kill switch (variant off)</span><input type="checkbox" id="kill" ${S.kill ? "checked" : ""} style="accent-color:var(--kr-blue)"></label>
      </div>
      <div class="sep"></div>
      <div class="grp"><h3>Payment</h3>
        <div class="row"><span>Next payment</span><div class="seg" id="outSeg"><button data-v="success" aria-pressed="${S.outcome === "success"}">Succeeds</button><button data-v="decline" aria-pressed="${S.outcome === "decline"}">Declined</button></div></div>
        <div class="row"><span>Browser supports</span><span style="display:flex;gap:10px"><label class="chk"><input type="checkbox" id="apSup" ${S.apple ? "checked" : ""}> Apple Pay</label><label class="chk"><input type="checkbox" id="gpSup" ${S.google ? "checked" : ""}> G Pay</label></span></div>
      </div>
      <div class="sep"></div>
      <div class="grp"><h3>Open decision §7</h3>
        <label class="row"><span>Quarterly badge</span><select id="badgeSel" class="mini-select"><option value="popular" ${S.badge === "popular" ? "selected" : ""}>“Popular” (today)</option><option value="save" ${S.badge === "save" ? "selected" : ""}>“Save 37%”</option></select></label>
      </div>
    </div>`;
    renderAssign();
  } else {
    r.innerHTML = `<div class="pop log" role="dialog" aria-label="Mixpanel events">
      <h3>Mixpanel events · server-side <button class="mini-btn" id="clearLog" style="padding:2px 8px;font-size:11px">Clear</button></h3>
      <div class="events" id="events" aria-live="polite"></div>
    </div>`;
    renderLog();
  }
}
function renderAssign() {
  const el = document.getElementById("assign"); if (!el) return;
  const b = bucket(S.uid), a = arm();
  const src = S.kill ? `<span class="pill off">kill switch on</span>` : S.armMode === "auto" ? `bucket <b>${b}</b> ${b < 50 ? "&lt; 50" : "≥ 50"}` : `<span class="pill off">manual override</span>`;
  el.innerHTML = `arm <span class="pill ${a}">${a}</span> · ${src}<br>
    enrolled: ${S.enrolled ? `<span class="pill ${S.enrolled.arm}">${S.enrolled.arm}</span> via <b>${S.enrolled.trigger}</b>` : S.premium ? "no (premium)" : "not yet"} · <b>${S.premium ? "Premium" : "Free"}</b>`;
}
function togglePop(v) {
  S.pop = S.pop === v ? null : v;
  if (S.pop === "log") S.unread = 0;
  renderPop(); renderToolbar();
}
function fit() {
  const stage = document.getElementById("stage"), d = document.getElementById("device"), sc = document.getElementById("scaler");
  const W = stage.clientWidth, H = stage.clientHeight;
  if (S.device === "desktop") {
    d.className = "device full";
    d.style.width = W + "px"; d.style.height = H + "px"; d.style.transform = "none";
    sc.style.width = W + "px"; sc.style.height = H + "px";
    return;
  }
  const [w, h] = DEVICES[S.device];
  const s = Math.min(1, (W - 48) / w, (H - 48) / h);
  d.className = "device framed";
  d.style.width = w + "px"; d.style.height = h + "px"; d.style.transform = `scale(${s})`;
  sc.style.width = w * s + "px"; sc.style.height = h * s + "px";
}
/* Changing arm, user or kill switch starts a fresh user, because enrolment is sticky by design */
function resetUser() {
  S.gen = (S.gen || 0) + 1;
  Object.assign(S, { premium: false, enrolled: null, modal: null, downloadState: null, trigger: null, plan: CONFIG.defaultPlan, error: null, unread: 0 });
  events = [];
  renderApp(); renderLog(); renderAssign(); renderToolbar();
}
document.getElementById("tb").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.arm) { S.armMode = b.dataset.arm; S.kill = false; resetUser(); renderPop(); }
  else if (b.dataset.dev) { S.device = b.dataset.dev; fit(); renderApp(); renderToolbar(); }
  else if (b.dataset.pop) togglePop(b.dataset.pop);
  else if (b.dataset.act === "reset") { resetUser(); renderPop(); }
};
const popRoot = document.getElementById("popRoot");
popRoot.onclick = e => {
  const tr = e.target.closest("[data-t]");
  if (tr) { S.pop = null; renderPop(); renderToolbar(); return openPaywall(tr.dataset.t); }
  const seg = e.target.closest("#outSeg button");
  if (seg) { S.outcome = seg.dataset.v; renderPop(); }
  if (e.target.id === "clearLog") { events = []; renderLog(); }
};
popRoot.onchange = e => {
  const id = e.target.id;
  if (id === "autoArm") { S.armMode = e.target.checked ? "auto" : arm(); resetUser(); }
  if (id === "kill") { S.kill = e.target.checked; resetUser(); }
  if (id === "apSup") { S.apple = e.target.checked; renderModal(); }
  if (id === "gpSup") { S.google = e.target.checked; renderModal(); }
  if (id === "badgeSel") { S.badge = e.target.value; renderModal(); }
};
popRoot.oninput = e => { if (e.target.id === "uid") { S.uid = e.target.value.trim() || "u_0"; resetUser(); } };
document.addEventListener("pointerdown", e => {
  if (S.pop && !e.target.closest(".pop, .tb")) { S.pop = null; renderPop(); renderToolbar(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.pop && !document.querySelector("#modalRoot [role=dialog], #sheetRoot .sheet")) { const v = S.pop; S.pop = null; renderPop(); renderToolbar(); document.querySelector(`[data-pop="${v}"]`)?.focus(); }
});
let rz; window.addEventListener("resize", () => { fit(); clearTimeout(rz); rz = setTimeout(() => { if (S.device === "desktop") renderApp(); }, 150); });

renderToolbar(); fit(); renderApp();
</script>
